receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  telemetry_buffer:
    traces_buffer_size: 10000  # Number of spans to keep in the buffer
    metrics_buffer_size: 5000  # Number of metric data points to keep in the buffer
    logs_buffer_size: 5000     # Number of log records to keep in the buffer

exporters:
  logging:
    verbosity: detailed
  otlp:
    endpoint: localhost:4319
    tls:
      insecure: true

extensions:
  telemetry_query:
    endpoint: 0.0.0.0:4319  # gRPC endpoint for the query service

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [telemetry_buffer]
      exporters: [logging, otlp]
    metrics:
      receivers: [otlp]
      processors: [telemetry_buffer]
      exporters: [logging, otlp]
    logs:
      receivers: [otlp]
      processors: [telemetry_buffer]
      exporters: [logging, otlp]
  
  extensions: [telemetry_query]