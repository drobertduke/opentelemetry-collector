syntax = "proto3";

package telemetryquery;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/dvroom/telemetrycollector/internal/telemetryqueryextension";

// TelemetryType defines the type of telemetry data.
enum TelemetryType {
  TELEMETRY_TYPE_UNSPECIFIED = 0;
  TELEMETRY_TYPE_TRACES = 1;
  TELEMETRY_TYPE_METRICS = 2;
  TELEMETRY_TYPE_LOGS = 3;
}

// QueryRequest is a request to query telemetry data from the ring buffer.
message QueryRequest {
  // Type of telemetry data to query.
  TelemetryType telemetry_type = 1;
  
  // Optional start time for filtering by time range.
  google.protobuf.Timestamp start_time = 2;
  
  // Optional end time for filtering by time range.
  google.protobuf.Timestamp end_time = 3;
  
  // Optional trace ID for filtering by trace.
  string trace_id = 4;
  
  // Optional service name for filtering by service.
  string service_name = 5;
  
  // Optional maximum number of results to return.
  int32 limit = 6;
}

// SubscribeRequest is a request to subscribe to telemetry data from the ring buffer.
message SubscribeRequest {
  // Type of telemetry data to subscribe to.
  TelemetryType telemetry_type = 1;
  
  // Optional start time for filtering by time range.
  google.protobuf.Timestamp start_time = 2;
  
  // Optional trace ID for filtering by trace.
  string trace_id = 3;
  
  // Optional service name for filtering by service.
  string service_name = 4;
}

// QueryResponse is a response containing telemetry data.
message QueryResponse {
  // Spans returned for trace queries.
  repeated Span spans = 1;
  
  // Metrics returned for metric queries.
  repeated MetricDataPoint metrics = 2;
  
  // Logs returned for log queries.
  repeated LogRecord logs = 3;
}

// Span represents a trace span.
message Span {
  string trace_id = 1;
  string span_id = 2;
  string parent_span_id = 3;
  string name = 4;
  string kind = 5;
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp end_time = 7;
  int64 duration_nanos = 8;
  string status_code = 9;
  string status_message = 10;
  string service_name = 11;
  map<string, AttributeValue> attributes = 12;
}

// LogRecord represents a log record.
message LogRecord {
  string trace_id = 1;
  string span_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  string severity_text = 4;
  int32 severity_number = 5;
  string body = 6;
  string service_name = 7;
  map<string, AttributeValue> attributes = 8;
}

// MetricDataPoint represents a metric data point.
message MetricDataPoint {
  string name = 1;
  string description = 2;
  string unit = 3;
  string type = 4;
  google.protobuf.Timestamp timestamp = 5;
  oneof value {
    int64 int_value = 6;
    double double_value = 7;
    Count count = 8;
  }
  string service_name = 9;
  map<string, AttributeValue> attributes = 10;
}

// Count is a simple count value.
message Count {
  int64 count = 1;
}

// AttributeValue represents a value of an attribute.
message AttributeValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    ArrayValue array_value = 5;
    KeyValueList kvlist_value = 6;
    bytes bytes_value = 7;
  }
}

// ArrayValue represents an array of values.
message ArrayValue {
  repeated AttributeValue values = 1;
}

// KeyValueList represents a list of key-value pairs.
message KeyValueList {
  repeated KeyValue values = 1;
}

// KeyValue represents a key-value pair.
message KeyValue {
  string key = 1;
  AttributeValue value = 2;
}

// BufferInfo contains information about a ring buffer.
message BufferInfo {
  // Type of telemetry data in the buffer.
  TelemetryType telemetry_type = 1;
  
  // Current number of items in the buffer.
  int32 size = 2;
  
  // Maximum capacity of the buffer.
  int32 capacity = 3;
  
  // Oldest timestamp in the buffer.
  google.protobuf.Timestamp oldest_timestamp = 4;
  
  // Newest timestamp in the buffer.
  google.protobuf.Timestamp newest_timestamp = 5;
}

// BufferInfoResponse contains information about all ring buffers.
message BufferInfoResponse {
  // Information about each buffer.
  repeated BufferInfo buffers = 1;
}

// TelemetryQueryService provides methods to query telemetry data from the ring buffer.
service TelemetryQueryService {
  // Query returns telemetry data from the ring buffer based on the request.
  rpc Query(QueryRequest) returns (QueryResponse);
  
  // Subscribe streams telemetry data from the ring buffer based on the request.
  rpc Subscribe(SubscribeRequest) returns (stream QueryResponse);
  
  // GetBufferInfo returns information about the ring buffers.
  rpc GetBufferInfo(google.protobuf.Empty) returns (BufferInfoResponse);
}