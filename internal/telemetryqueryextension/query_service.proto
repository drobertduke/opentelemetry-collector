syntax = "proto3";

package telemetryquery;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "go.opentelemetry.io/collector/internal/telemetryqueryextension";

// TelemetryQueryService provides a gRPC API for querying telemetry data from the ring buffer.
service TelemetryQueryService {
  // QueryTraces retrieves spans from the traces ring buffer.
  rpc QueryTraces(TraceQueryRequest) returns (TraceQueryResponse);
  
  // QueryMetrics retrieves metrics from the metrics ring buffer.
  rpc QueryMetrics(MetricQueryRequest) returns (MetricQueryResponse);
  
  // QueryLogs retrieves logs from the logs ring buffer.
  rpc QueryLogs(LogQueryRequest) returns (LogQueryResponse);
  
  // SubscribeTraces streams new spans as they arrive in the ring buffer.
  rpc SubscribeTraces(TraceQueryRequest) returns (stream TraceQueryResponse);
  
  // SubscribeMetrics streams new metrics as they arrive in the ring buffer.
  rpc SubscribeMetrics(MetricQueryRequest) returns (stream MetricQueryResponse);
  
  // SubscribeLogs streams new logs as they arrive in the ring buffer.
  rpc SubscribeLogs(LogQueryRequest) returns (stream LogQueryResponse);
  
  // GetBufferInfo returns information about the ring buffers.
  rpc GetBufferInfo(google.protobuf.Empty) returns (BufferInfoResponse);
}

// TraceQueryRequest defines the parameters for querying traces.
message TraceQueryRequest {
  // Optional start time, if omitted we return all available.
  google.protobuf.Timestamp start_time = 1;
  
  // Optional end time, if omitted we return up to the latest.
  google.protobuf.Timestamp end_time = 2;
  
  // Optional service name to filter.
  string service_name = 3;
  
  // Optional trace ID to filter.
  string trace_id = 4;
  
  // Optional span ID to filter.
  string span_id = 5;
  
  // Optional limit on the number of results to return.
  int32 limit = 6;
  
  // Optional flag to indicate immediate mode (for streaming).
  bool immediate_mode = 7;
}

// TraceQueryResponse contains spans matching the query.
message TraceQueryResponse {
  repeated Span spans = 1;
}

// Span represents a simplified span for the query API.
message Span {
  string trace_id = 1;
  string span_id = 2;
  string parent_span_id = 3;
  string name = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;
  map<string, string> attributes = 7;
  map<string, string> resource_attrs = 8;
  int32 status_code = 9;
  string status_message = 10;
}

// MetricQueryRequest defines the parameters for querying metrics.
message MetricQueryRequest {
  // Optional start time, if omitted we return all available.
  google.protobuf.Timestamp start_time = 1;
  
  // Optional end time, if omitted we return up to the latest.
  google.protobuf.Timestamp end_time = 2;
  
  // Optional service name to filter.
  string service_name = 3;
  
  // Optional metric name to filter.
  string metric_name = 4;
  
  // Optional limit on the number of results to return.
  int32 limit = 5;
  
  // Optional flag to indicate immediate mode (for streaming).
  bool immediate_mode = 6;
}

// MetricQueryResponse contains metrics matching the query.
message MetricQueryResponse {
  repeated Metric metrics = 1;
}

// Metric represents a simplified metric for the query API.
message Metric {
  string name = 1;
  string description = 2;
  string unit = 3;
  string type = 4;
  google.protobuf.Timestamp timestamp = 5;
  oneof value {
    double double_value = 6;
    int64 int_value = 7;
    bool bool_value = 8;
    string string_value = 9;
  }
  map<string, string> attributes = 10;
  map<string, string> resource_attrs = 11;
}

// LogQueryRequest defines the parameters for querying logs.
message LogQueryRequest {
  // Optional start time, if omitted we return all available.
  google.protobuf.Timestamp start_time = 1;
  
  // Optional end time, if omitted we return up to the latest.
  google.protobuf.Timestamp end_time = 2;
  
  // Optional service name to filter.
  string service_name = 3;
  
  // Optional severity text to filter.
  string severity_text = 4;
  
  // Optional severity number to filter.
  int32 severity_number = 5;
  
  // Optional body substring to filter.
  string body_contains = 6;
  
  // Optional limit on the number of results to return.
  int32 limit = 7;
  
  // Optional flag to indicate immediate mode (for streaming).
  bool immediate_mode = 8;
}

// LogQueryResponse contains logs matching the query.
message LogQueryResponse {
  repeated Log logs = 1;
}

// Log represents a simplified log record for the query API.
message Log {
  google.protobuf.Timestamp timestamp = 1;
  string severity_text = 2;
  int32 severity_number = 3;
  string body = 4;
  map<string, string> attributes = 5;
  map<string, string> resource_attrs = 6;
}

// BufferInfo contains information about a ring buffer.
message BufferInfo {
  int32 capacity = 1;
  int32 size = 2;
}

// BufferInfoResponse contains information about all ring buffers.
message BufferInfoResponse {
  BufferInfo traces_buffer = 1;
  BufferInfo metrics_buffer = 2;
  BufferInfo logs_buffer = 3;
}