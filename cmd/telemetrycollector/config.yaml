# OpenTelemetry Collector configuration with Ring Buffer Query Extension

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  telemetry_buffer:
    traces_buffer_size: 10000
    metrics_buffer_size: 5000
    logs_buffer_size: 10000

exporters:
  logging:
    verbosity: detailed

extensions:
  telemetry_query:
    endpoint: 0.0.0.0:4319

service:
  extensions: [telemetry_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [telemetry_buffer]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [telemetry_buffer]
      exporters: [logging]
    logs:
      receivers: [otlp]
      processors: [telemetry_buffer]
      exporters: [logging]